<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Rounded square background -->
    <clipPath id="roundedSquare">
      <rect x="0" y="0" width="512" height="512" rx="96" ry="96"/>
    </clipPath>

    <linearGradient id="woodBoard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8a5a34"/>
      <stop offset="50%" stop-color="#a06b3d"/>
      <stop offset="100%" stop-color="#7a4c2a"/>
    </linearGradient>

    <linearGradient id="woodPlank" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b9793f"/>
      <stop offset="100%" stop-color="#8f5a30"/>
    </linearGradient>

    <radialGradient id="woodVignette" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </radialGradient>

    <linearGradient id="bladeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#eaf6ff"/>
      <stop offset="55%" stop-color="#b9dcef"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <radialGradient id="splashGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6b5a"/>
      <stop offset="100%" stop-color="#c8281c"/>
    </radialGradient>

    <!-- watermelon + blade gradients copied from banner.svg -->
    <radialGradient id="bWmFlesh" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#ff9494"/>
      <stop offset="70%" stop-color="#ff5757"/>
      <stop offset="100%" stop-color="#e5313f"/>
    </radialGradient>
    <linearGradient id="bWmRind" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7fd858"/>
      <stop offset="100%" stop-color="#3f9c1c"/>
    </linearGradient>
    <linearGradient id="bBladeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffe27a" stop-opacity="1"/>
    </linearGradient>
    <filter id="bSoftShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="bGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- extra background fruit gradients -->
    <radialGradient id="strawBody" cx="45%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ff8a8a"/>
      <stop offset="60%" stop-color="#f0392f"/>
      <stop offset="100%" stop-color="#c81f1f"/>
    </radialGradient>
    <radialGradient id="grapeBody" cx="40%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#b78cf0"/>
      <stop offset="60%" stop-color="#7a3fc9"/>
      <stop offset="100%" stop-color="#5a2a99"/>
    </radialGradient>
    <linearGradient id="bananaBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe27a"/>
      <stop offset="100%" stop-color="#f2b21f"/>
    </linearGradient>
    <radialGradient id="kiwiBody" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#dff29a"/>
      <stop offset="70%" stop-color="#a8d24a"/>
      <stop offset="100%" stop-color="#7a9c2f"/>
    </radialGradient>
  </defs>

  <!-- Background rounded square -->
  <g clip-path="url(#roundedSquare)">
    <rect x="0" y="0" width="512" height="512" fill="url(#woodBoard)"/>

    <!-- wood plank lines for texture -->
    <g opacity="0.35" stroke="#5c3a1f" stroke-width="3">
      <line x1="0" y1="60" x2="512" y2="55"/>
      <line x1="0" y1="150" x2="512" y2="148"/>
      <line x1="0" y1="245" x2="512" y2="250"/>
      <line x1="0" y1="340" x2="512" y2="335"/>
      <line x1="0" y1="430" x2="512" y2="425"/>
    </g>
    <g opacity="0.15" stroke="#3f260f" stroke-width="1">
      <path d="M20,10 Q60,120 30,240 T50,470"/>
      <path d="M480,20 Q440,140 470,260 T440,490"/>
      <path d="M250,0 Q270,140 240,280 T260,500"/>
    </g>

    <!-- inner rounded border frame -->
    <rect x="18" y="18" width="476" height="476" rx="72" ry="72" fill="none" stroke="#5c3a1f" stroke-width="10" opacity="0.5"/>

    <!-- juice splash puddle bottom-left -->
    <g fill="url(#splashGrad)" opacity="0.9">
      <ellipse cx="70" cy="440" rx="55" ry="26"/>
      <circle cx="30" cy="400" r="14"/>
      <circle cx="115" cy="405" r="10"/>
      <circle cx="20" cy="460" r="9"/>
    </g>

    <!-- sliced watermelon, exact layer structure from banner.svg, wrapped in one transform to align with the blade -->
    <g filter="url(#bSoftShadow)" transform="translate(260,270) rotate(-19) scale(1.35) translate(-207.5,-238.5)">
      <!-- top half -->
      <g transform="translate(215,215) rotate(-14)">
        <path d="M -70 0 A 70 70 0 0 1 70 0 Z" fill="url(#bWmRind)" stroke="#245b0e" stroke-width="3"/>
        <path d="M -62 -3 A 62 62 0 0 1 62 -3 L 62 4 A 62 62 0 0 1 -62 4 Z" fill="#f4e9c9"/>
        <path d="M -55 3 A 55 55 0 0 1 55 3 Z" fill="url(#bWmFlesh)"/>
        <circle cx="-25" cy="-20" r="3.4" fill="#2b1400"/>
        <circle cx="0" cy="-28" r="3.4" fill="#2b1400"/>
        <circle cx="25" cy="-20" r="3.4" fill="#2b1400"/>
        <circle cx="-12" cy="-10" r="3" fill="#2b1400"/>
        <circle cx="14" cy="-10" r="3" fill="#2b1400"/>
      </g>
      <!-- bottom half, offset for the slice gap -->
      <g transform="translate(200,262) rotate(-14)">
        <path d="M -70 6 A 70 70 0 0 0 70 6 Z" fill="url(#bWmRind)" stroke="#245b0e" stroke-width="3"/>
        <path d="M -62 3 A 62 62 0 0 0 62 3 L 62 -4 A 62 62 0 0 0 -62 -4 Z" fill="#f4e9c9"/>
        <path d="M -55 -3 A 55 55 0 0 0 55 -3 Z" fill="url(#bWmFlesh)"/>
        <circle cx="-22" cy="18" r="3.4" fill="#2b1400"/>
        <circle cx="2" cy="24" r="3.4" fill="#2b1400"/>
        <circle cx="26" cy="16" r="3.4" fill="#2b1400"/>
        <circle cx="-10" cy="10" r="3" fill="#2b1400"/>
      </g>
    </g>

    <!-- orange slice top right -->
    <g transform="translate(390,110) rotate(10)">
      <circle r="55" fill="#f2941f"/>
      <circle r="46" fill="#ffb347"/>
      <g fill="#ffd27a" stroke="#f2941f" stroke-width="2">
        <path d="M0,0 L0,-44 A44,44 0 0 1 38,-22 Z"/>
        <path d="M0,0 L38,-22 A44,44 0 0 1 38,22 Z"/>
        <path d="M0,0 L38,22 A44,44 0 0 1 0,44 Z"/>
        <path d="M0,0 L0,44 A44,44 0 0 1 -38,22 Z"/>
        <path d="M0,0 L-38,22 A44,44 0 0 1 -38,-22 Z"/>
        <path d="M0,0 L-38,-22 A44,44 0 0 1 0,-44 Z"/>
      </g>
    </g>

    <!-- avocado bottom left -->
    <g transform="translate(105,375) rotate(-8)">
      <path d="M0,-55 C40,-55 55,-15 45,25 C35,60 5,60 -5,25 C-45,15 -40,-45 0,-55 Z" fill="#5b8c3e"/>
      <path d="M0,-46 C32,-46 44,-14 36,20 C28,50 4,50 -4,20 C-36,12 -32,-38 0,-46 Z" fill="#e9edb0"/>
      <circle cx="4" cy="6" r="16" fill="#7a4a2a"/>
      <circle cx="-1" cy="1" r="16" fill="#94582f" opacity="0.6"/>
    </g>

    <!-- strawberry, upper left -->
    <g transform="translate(80,150) rotate(-12)">
      <path d="M0,-8 C-24,-8 -30,20 -14,40 C-6,50 6,50 14,40 C30,20 24,-8 0,-8 Z" fill="url(#strawBody)"/>
      <g fill="#ffe27a" opacity="0.85">
        <circle cx="-9" cy="4" r="2"/>
        <circle cx="7" cy="0" r="2"/>
        <circle cx="0" cy="16" r="2"/>
        <circle cx="-10" cy="22" r="2"/>
        <circle cx="10" cy="20" r="2"/>
        <circle cx="0" cy="34" r="1.8"/>
      </g>
      <path d="M-14,-10 L0,-20 L14,-10 L6,-14 L0,-8 L-6,-14 Z" fill="#4f9d3c"/>
    </g>

    <!-- grape cluster, right side -->
    <g transform="translate(452,300)">
      <path d="M0,-22 Q4,-32 12,-30" stroke="#4f9d3c" stroke-width="3" fill="none" stroke-linecap="round"/>
      <g fill="url(#grapeBody)" stroke="#4a1f80" stroke-width="0.5">
        <circle cx="-8" cy="-10" r="8"/>
        <circle cx="8" cy="-10" r="8"/>
        <circle cx="0" cy="0" r="8"/>
        <circle cx="-14" cy="4" r="8"/>
        <circle cx="14" cy="4" r="8"/>
        <circle cx="-6" cy="16" r="8"/>
        <circle cx="8" cy="18" r="8"/>
        <circle cx="0" cy="30" r="8"/>
      </g>
    </g>

    <!-- banana, lower right -->
    <g transform="translate(455,395) rotate(25)">
      <path d="M-30,10 C-30,-14 -6,-24 14,-20 C10,-16 4,-12 -4,-8 C-16,-2 -22,10 -18,22 C-24,20 -30,16 -30,10 Z" fill="url(#bananaBody)" stroke="#c98a1f" stroke-width="1.5"/>
      <path d="M14,-20 C18,-21 21,-19 20,-15 C18,-16 15,-17 14,-20 Z" fill="#8f5a30"/>
    </g>

    <!-- kiwi slice, lower left -->
    <g transform="translate(195,455) rotate(6)">
      <circle r="26" fill="url(#kiwiBody)" stroke="#5c3a1f" stroke-width="2"/>
      <circle r="10" fill="#f4e9c9"/>
      <g fill="#2c1c12">
        <circle cx="0" cy="-16" r="1.8"/>
        <circle cx="11" cy="-12" r="1.8"/>
        <circle cx="16" cy="0" r="1.8"/>
        <circle cx="11" cy="12" r="1.8"/>
        <circle cx="0" cy="16" r="1.8"/>
        <circle cx="-11" cy="12" r="1.8"/>
        <circle cx="-16" cy="0" r="1.8"/>
        <circle cx="-11" cy="-12" r="1.8"/>
      </g>
    </g>

    <!-- blade slash through the fruit, copied from banner.svg -->
    <g filter="url(#bGlow)">
      <path d="M 60 400 L 460 140" stroke="url(#bBladeGrad)" stroke-width="14" stroke-linecap="round" fill="none"/>
    </g>
    <circle cx="460" cy="140" r="9" fill="#fff6d8" filter="url(#bGlow)"/>

    <!-- juice drip splatter accents -->
    <g fill="#c8281c" opacity="0.85">
      <circle cx="430" cy="440" r="8"/>
      <circle cx="455" cy="465" r="5"/>
      <circle cx="60" cy="330" r="6"/>
      <circle cx="245" cy="120" r="5"/>
    </g>

    <!-- vignette for depth -->
    <rect x="0" y="0" width="512" height="512" fill="url(#woodVignette)"/>
  </g>

  <!-- outer rounded border stroke -->
  <rect x="4" y="4" width="504" height="504" rx="94" ry="94" fill="none" stroke="#3f260f" stroke-width="6" opacity="0.6"/>

  <!-- Game title -->
  <text x="256" y="60" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900"
        font-size="46" fill="#ffffff" stroke="#7a1f12" stroke-width="6" paint-order="stroke" letter-spacing="1">
    HAND-NINJA
  </text>
</svg>
