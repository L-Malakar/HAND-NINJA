<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="roundedSquare">
      <rect x="0" y="0" width="512" height="512" rx="96" ry="96"/>
    </clipPath>

    <linearGradient id="woodBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e2a267"/>
      <stop offset="55%" stop-color="#c9793f"/>
      <stop offset="100%" stop-color="#a85c2c"/>
    </linearGradient>

    <radialGradient id="vignette" cx="50%" cy="45%" r="72%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4"/>
    </radialGradient>

    <linearGradient id="rindDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5aa832"/>
      <stop offset="100%" stop-color="#2f7a16"/>
    </linearGradient>
    <linearGradient id="rindLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8fd85a"/>
      <stop offset="100%" stop-color="#4f9c2a"/>
    </linearGradient>
    <radialGradient id="fleshGrad" cx="42%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#ffb3ab"/>
      <stop offset="55%" stop-color="#ff5b52"/>
      <stop offset="100%" stop-color="#e1281f"/>
    </radialGradient>

    <linearGradient id="bladeMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#eef3f7"/>
      <stop offset="55%" stop-color="#aebcc7"/>
      <stop offset="100%" stop-color="#7d8d99"/>
    </linearGradient>

    <linearGradient id="splashGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff5b45"/>
      <stop offset="100%" stop-color="#c81f22"/>
    </linearGradient>

    <filter id="dropShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g clip-path="url(#roundedSquare)">
    <!-- background -->
    <rect width="512" height="512" fill="url(#woodBg)"/>
    <g opacity="0.18" stroke="#5a3315" stroke-width="3" fill="none">
      <path d="M-20 60 Q256 80 540 55"/>
      <path d="M-20 140 Q256 118 540 145"/>
      <path d="M-20 230 Q256 250 540 225"/>
      <path d="M-20 320 Q256 300 540 325"/>
      <path d="M-20 410 Q256 430 540 405"/>
      <path d="M-20 480 Q256 460 540 490"/>
    </g>

    <!-- red splash spikes, top right and bottom left like the reference -->
    <g filter="url(#dropShadow)">
      <path d="M320 40 L358 118 L392 30 L400 132 L440 55 L418 150 L470 96 L400 175 Z"
            fill="url(#splashGrad)"/>
      <path d="M368 205 L420 258 L400 210 L468 250 L410 285 L458 330 L392 305 L400 355 Z"
            fill="url(#splashGrad)"/>
    </g>
    <g fill="#d1231f" opacity="0.9">
      <circle cx="58" cy="330" r="14"/>
      <circle cx="40" cy="378" r="10"/>
      <circle cx="86" cy="400" r="16"/>
      <circle cx="70" cy="450" r="11"/>
      <circle cx="120" cy="460" r="9"/>
      <circle cx="430" cy="410" r="9"/>
      <circle cx="452" cy="450" r="12"/>
    </g>
    <path d="M20 300 Q10 380 30 470 Q55 490 90 470 Q60 420 70 380 Q40 350 20 300 Z"
          fill="url(#splashGrad)" opacity="0.95"/>

    <!-- top-left watermelon half (uncut, whole side) -->
    <g filter="url(#dropShadow)" transform="translate(178,168) rotate(-8)">
      <ellipse cx="0" cy="0" rx="118" ry="120" fill="url(#rindDark)"/>
      <g stroke="url(#rindLight)" stroke-width="14" fill="none" opacity="0.85">
        <path d="M -60 -105 Q -85 0 -55 108"/>
        <path d="M -15 -118 Q -35 0 -12 118"/>
        <path d="M 35 -114 Q 18 0 40 112"/>
        <path d="M 78 -90 Q 65 0 82 88"/>
      </g>
      <ellipse cx="-35" cy="-42" rx="30" ry="18" fill="#ffffff" opacity="0.18"/>
    </g>

    <!-- bottom-right watermelon half (cut face showing flesh) -->
    <g filter="url(#dropShadow)" transform="translate(330,336) rotate(-8)">
      <ellipse cx="0" cy="0" rx="128" ry="126" fill="url(#rindDark)"/>
      <ellipse cx="0" cy="0" rx="112" ry="110" fill="#f6ecc8"/>
      <ellipse cx="0" cy="0" rx="98" ry="96" fill="url(#fleshGrad)"/>
      <g fill="#2a1200">
        <ellipse cx="-40" cy="-30" rx="5.5" ry="8" transform="rotate(-20 -40 -30)"/>
        <ellipse cx="0" cy="-52" rx="5.5" ry="8" transform="rotate(0 0 -52)"/>
        <ellipse cx="42" cy="-30" rx="5.5" ry="8" transform="rotate(20 42 -30)"/>
        <ellipse cx="-55" cy="10" rx="5.5" ry="8" transform="rotate(-45 -55 10)"/>
        <ellipse cx="55" cy="10" rx="5.5" ry="8" transform="rotate(45 55 10)"/>
        <ellipse cx="-20" cy="45" rx="5.5" ry="8" transform="rotate(-15 -20 45)"/>
        <ellipse cx="24" cy="48" rx="5.5" ry="8" transform="rotate(15 24 48)"/>
        <ellipse cx="0" cy="0" rx="5.5" ry="8"/>
      </g>
    </g>

    <!-- the blade slicing diagonally across, matching the reference pose -->
    <g filter="url(#softGlow)" transform="rotate(-42 256 256)">
      <path d="M -260 -14 L 258 -34 L 300 0 L 258 34 L -260 14 Z" fill="url(#bladeMetal)"/>
      <path d="M -260 -6 L 240 -18" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
    </g>

    <!-- HAND NINJA MASALA: a stylised right-hand index fingertip glint riding the blade tip,
         nodding to the game's index-finger hand-tracking control -->
    <g transform="translate(300,220) rotate(-8)" filter="url(#softGlow)">
      <circle r="15" fill="#fff6d8"/>
      <circle r="15" fill="none" stroke="#ffcf6b" stroke-width="3"/>
    </g>

    <!-- small chili/spice accent for "masala" flavor, tucked in a corner -->
    <g transform="translate(430,86) rotate(18)" filter="url(#dropShadow)">
      <path d="M-8 -18 C 4 -22 14 -12 10 2 C 6 16 -6 22 -14 14 C -22 6 -16 -14 -8 -18 Z"
            fill="#e8461f" stroke="#a12e0f" stroke-width="2"/>
      <path d="M-6 -18 C -2 -26 8 -30 12 -24" stroke="#3f9c1c" stroke-width="4" fill="none" stroke-linecap="round"/>
    </g>

    <!-- top ribbon banner with the game name -->
    <g filter="url(#dropShadow)">
      <path d="M0 0 L512 0 L512 74 Q256 100 0 74 Z" fill="#1c1006" opacity="0.55"/>
    </g>
    <text x="256" y="56" text-anchor="middle" font-family="Arial Black, Arial, sans-serif"
          font-weight="900" font-size="46" fill="#ffd23f" stroke="#5a2c00" stroke-width="3"
          paint-order="stroke" letter-spacing="1">HAND NINJA</text>
  </g>

  <!-- rounded-square outline for a crisp app-icon edge -->
  <rect x="3" y="3" width="506" height="506" rx="94" ry="94" fill="none" stroke="#1c1006" stroke-opacity="0.35" stroke-width="6"/>
</svg>
